services:
  open-semrush:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-semrush:latest
    container_name: open-semrush-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      OPEN_SEMRUSH_API_TOKEN: ${OPEN_SEMRUSH_API_TOKEN:-}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      API_RATE_LIMIT_EXPENSIVE_MAX: ${API_RATE_LIMIT_EXPENSIVE_MAX:-10}
      OPEN_SEMRUSH_DATA_DIR: /app/data
    volumes:
      - open-semrush-data:/app/data
volumes:
  open-semrush-data:
