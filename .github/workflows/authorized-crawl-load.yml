name: Authorized Crawl Load Benchmark

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL on a site you own or have explicit permission to load-test
        required: true
        type: string
      confirm_authorized:
        description: Confirm authorization to crawl/load-test this target
        required: true
        type: choice
        options:
          - no
          - yes

permissions:
  contents: read

jobs:
  crawl-load:
    if: inputs.confirm_authorized == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Configure ephemeral token and start API
        run: |
          echo "OPEN_SEMRUSH_API_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "LOAD_TEST_CONFIRM=I_OWN_OR_HAVE_PERMISSION" >> "$GITHUB_ENV"
          echo "LOAD_TEST_MODE=crawl" >> "$GITHUB_ENV"
          echo "LOAD_TEST_ITERATIONS=10" >> "$GITHUB_ENV"
          echo "LOAD_TEST_CONCURRENCY=2" >> "$GITHUB_ENV"
      - name: Start server and wait for health
        run: |
          NODE_ENV=production PORT=3000 node scripts/semrush-server.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl --fail http://127.0.0.1:3000/api/health
      - name: Run authorized crawl benchmark
        env:
          LOAD_TEST_TARGET_URL: ${{ inputs.target_url }}
        run: |
          npm run benchmark:load > crawl-load-benchmark.json
          cat crawl-load-benchmark.json
      - name: Upload crawl benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-crawl-load-benchmark
          path: |
            crawl-load-benchmark.json
            server.log
          if-no-files-found: warn
