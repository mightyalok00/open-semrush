name: Quality, Coverage, Security and Docker Integration

on:
  workflow_dispatch:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency security vulnerability audit
        run: npm audit --audit-level=high
      - name: Check for committed secrets and sensitive keys
        run: node scripts/check-secrets.mjs
      - name: Build TypeScript (production compilation check)
        run: npm run build
      - name: Run dedicated security regression test suite
        run: npm run check:security
      - name: Run full test suite (60+ unit, integration, and recovery tests)
        run: npm test
      - name: Test with coverage report and threshold gate
        run: |
          npm run test:coverage | tee coverage-report.txt
          # Enforce that all files coverage stays above the 72% minimum threshold
          node -e "
            const fs = require('fs');
            const report = fs.readFileSync('coverage-report.txt', 'utf8');
            const match = report.match(/all files\s+\|\s+([\d\.]+)/);
            if (!match) process.exit(0);
            const cov = parseFloat(match[1]);
            console.log('Overall Line Coverage:', cov + '%');
            if (cov < 72.0) {
              console.error('FAIL: Coverage ' + cov + '% dropped below 72.0% threshold');
              process.exit(1);
            }
          "
      - name: Run reproducible microbenchmarks
        run: node scripts/benchmark.mjs | tee benchmark-results.json
      - name: Run crawl benchmark matrix
        run: node scripts/crawl-benchmark.mjs --matrix | tee crawl-matrix-results.json
      - name: Upload quality, security and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-node-${{ matrix.node-version }}
          path: |
            coverage-report.txt
            benchmark-results.json
            crawl-matrix-results.json
          if-no-files-found: warn

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "OPEN_SEMRUSH_API_TOKEN=ci-load-test-token" >> "$GITHUB_ENV"
      - name: Build and start clean Compose stack
        run: docker compose up -d --build
      - name: Verify health and API
        run: |
          for i in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break; sleep 2; done
          curl --fail http://localhost:3000/api/health
          curl --fail 'http://localhost:3000/api/keyword?q=seo%20audit' | grep -q '"verified":false'
      - name: Verify audit API and persistent history across restart
        run: |
          curl --fail --silent --show-error -X POST http://localhost:3000/api/audit -H 'Authorization: Bearer ci-load-test-token' -H 'Content-Type: application/json' -d '{"url":"https://example.com/","maxPages":1}' > audit-response.json
          curl --fail -H 'Authorization: Bearer ci-load-test-token' http://localhost:3000/api/projects | grep -q 'example.com'
          docker compose restart
          for i in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break; sleep 2; done
          curl --fail -H 'Authorization: Bearer ci-load-test-token' http://localhost:3000/api/projects | grep -q 'example.com'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Start local API
        run: |
          NODE_ENV=test PORT=3000 node scripts/semrush-server.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl --fail http://127.0.0.1:3000/api/health
      - name: Run reproducible concurrent HTTP smoke benchmark
        run: |
          LOAD_TEST_MODE=api LOAD_TEST_ITERATIONS=100 LOAD_TEST_CONCURRENCY=10 npm run benchmark:load > load-benchmark.json
          cat load-benchmark.json
      - name: Upload load benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-load-benchmark
          path: |
            load-benchmark.json
            server.log
          if-no-files-found: warn
