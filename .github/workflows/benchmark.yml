name: Performance and Crawl Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: "Benchmark Mode (simulated mock or live real target)"
        required: true
        type: choice
        options:
          - simulated
          - real
        default: simulated
      target_url:
        description: "Target URL (for real mode, use a site you own or have permission to test)"
        required: false
        type: string
        default: "https://example.com/"
      concurrency:
        description: "Concurrency Level"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
        default: "2"
      iterations:
        description: "Number of crawl iterations"
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
        default: "25"
      run_matrix:
        description: "Execute complete multi-page/multi-concurrency matrix benchmark"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run CPU microbenchmarks
        run: node scripts/benchmark.mjs | tee benchmark-results.json
      - name: Run crawl benchmark
        env:
          CRAWL_BENCH_MODE: ${{ inputs.benchmark_mode }}
          CRAWL_TARGET_URL: ${{ inputs.target_url }}
          CRAWL_BENCH_CONCURRENCY: ${{ inputs.concurrency }}
          CRAWL_BENCH_ITERATIONS: ${{ inputs.iterations }}
        run: |
          if [ "${{ inputs.run_matrix }}" = "yes" ]; then
            node scripts/crawl-benchmark.mjs --matrix | tee crawl-benchmark-results.json
          else
            node scripts/crawl-benchmark.mjs | tee crawl-benchmark-results.json
          fi
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-benchmark-results
          path: |
            benchmark-results.json
            crawl-benchmark-results.json
          if-no-files-found: warn
